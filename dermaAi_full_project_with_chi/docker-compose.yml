services:
  app:
    build:
      context: .
      args:
        VITE_DERMOSCOPY_MODEL_API_URL: ${VITE_DERMOSCOPY_MODEL_API_URL:-https://javariarizwan-ham10000-api.hf.space}
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-local-docker-development-key-not-for-production}
      DJANGO_DEBUG: "0"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      DATABASE_PATH: /data/db.sqlite3
      MEDIA_ROOT: /data/media
      DERMOSCOPY_MODEL_API_URL: ${DERMOSCOPY_MODEL_API_URL:-https://javariarizwan-ham10000-api.hf.space}
    volumes:
      - dermaai-data:/data
    ports:
      - "${DERMAAI_PORT:-8080}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

volumes:
  dermaai-data: